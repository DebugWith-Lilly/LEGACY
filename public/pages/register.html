
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | LEGACY</title>

    <link rel="icon" type="image/png" href="../images/favicon.png">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="page-auth">

    <header class="site-header">
        <a href="../index.html" class="brand" aria-label="LEGACY Home">
            <img src="../images/fingerprint-logo.png" alt="" class="brand-icon">
            <span class="brand-name">LEGACY</span>
        </a>
    </header>

    <main>
        <section class="auth-card">
            <h1>Create your account.</h1>
            <p class="subtitle">Your journey to effortless payments starts here.</p>

            <form id="register-form">

                <label for="fullName">Full Name</label>
                <input
                    type="text"
                    id="fullName"
                    name="fullName"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    required
                >

                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

                <label for="phone">Phone Number</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="+27"
                    autocomplete="tel"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >

                <label for="confirmPassword">Confirm Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Confirm your password"
                    autocomplete="new-password"
                    required
                >

                <label class="terms">
                    <input
                        type="checkbox"
                        id="terms"
                        name="terms"
                        required
                    >
                    I agree to the Terms and Conditions.
                </label>

                <p id="register-message" role="alert"></p>

                <button type="submit" id="register-button">
                    Create Account
                </button>

            </form>

            <p class="switch-link">
                Already have an account?
                <a href="login.html">Sign in</a>
            </p>
        </section>
    </main>

    <script type="module" src="../js/auth.js"></script>

</body>
</html>
