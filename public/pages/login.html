
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | LEGACY</title>
    <meta name="description" content="Sign in to your LEGACY account.">
</head>

<body>

    <header>
        <a href="../index.html">LEGACY</a>
        <p>Your Finger. Your Finance.</p>
    </header>

    <main>
        <section>
            <h1>Welcome Back</h1>
            <p>Sign in to access your LEGACY account.</p>

            <form id="login-form">

                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

                <p id="login-message" role="alert"></p>

                <button type="submit" id="login-button">
                    Sign In
                </button>

            </form>

            <p>
                Don't have an account?
                <a href="register.html">Create an account</a>
            </p>

            <a href="../index.html">Back to Home</a>
        </section>
    </main>

    <script type="module" src="../js/login.js"></script>

</body>
</html>
