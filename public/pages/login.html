
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | LEGACY</title>
    <meta name="description" content="Sign in to your LEGACY account.">

    <link rel="icon" type="image/png" href="../images/favicon.png">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>

<body class="page-auth">

    <header class="site-header">
        <a href="../index.html" class="brand" aria-label="LEGACY Home">
            <img src="../images/fingerprint-logo.png" alt="" class="brand-icon">
            <span class="brand-name">LEGACY</span>
        </a>
    </header>

    <main>
        <section class="auth-card">
            <h1>Welcome back.</h1>
            <p class="subtitle">Sign in to access your LEGACY account.</p>

            <form id="login-form">

                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

                <p id="login-message" role="alert"></p>

                <button type="submit" id="login-button">
                    Sign In
                </button>

            </form>

            <p class="switch-link">
                Don't have an account?
                <a href="register.html">Create an account</a>
            </p>

            <p class="switch-link">
                <a href="../index.html">Back to Home</a>
            </p>
        </section>
    </main>

    <script type="module" src="../js/login.js"></script>

</body>
</html>
